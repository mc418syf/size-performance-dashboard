name: Refresh dashboard data

on:
  push:
    paths:
      - "workbooks/**/*.xlsx"
      - "scripts/export-dashboard-data.ps1"
      - "scripts/refresh-dashboard.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild dashboard JSON
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\refresh-dashboard.ps1

      - name: Commit updated dashboard data
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No dashboard data changes to commit."
            exit 0
          }
          git commit -m "Refresh dashboard data"
          git push
